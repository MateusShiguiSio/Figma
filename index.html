<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anúncio Drone DJI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="card-anuncio">
        <div class="topo-azul">
            <div class="texto-chamada">
                <h1>Compre<br>seu<br><span>Drone</span></h1>
                <h2>Phantom 4k DJI!</h2>
            </div>
            <img src="Drone.png" alt="Drone DJI" class="imagem-drone">
        </div>

        <div class="conteudo-inferior">
            
            <div class="icones-container">
                <div class="item-icone">
                    <div class="circulo"><i class="fas fa-video"><p>Vídeo<br>Colorido</p></i></div>
                </div>
                <div class="item-icone">
                    <div class="circulo"><i class="fas fa-battery-full"><p>90<br>minutos</p></i></div>
                </div>
                <div class="item-icone">
                    <div class="circulo"><strong>HD<p>Cam<br>Full 4K</p></strong></div>
                </div>
            </div>

            <div class="preco-container">
                <p class="txt-por-apenas">Por apenas</p>
                <p class="preco">R$560,00!!!!!</p>
            </div>

            <div class="rodape-contato">
                <div class="contato-info">
                    <strong>Contato:</strong><br>
                    +55 (98) 86989-8890
                </div>
                <div class="email-info">
                    <strong>Email:</strong><br>
                    seudrone@gmail.com
                </div>
            </div>
        </div>
    </div>

</body>
</html>
